openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Contact message submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List contact messages
      security:
        - clerkSession: []
      responses:
        "200":
          description: Contact messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Sign-in required
        "403":
          description: Admin access required
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid message
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Lead:
      type: object
      required: [id, name, email, message, source, status, createdAt, responseNote, respondedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        source:
          type: string
        status:
          type: string
          enum: [new, responded]
        createdAt:
          type: string
          format: date-time
        responseNote:
          type: [string, "null"]
        respondedAt:
          type: [string, "null"]
          format: date-time
    LeadInput:
      type: object
      additionalProperties: false
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        message:
          type: string
          minLength: 1
          maxLength: 5000
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session

